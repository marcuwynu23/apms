
services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: apms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: apms
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - apms-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apms-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/apms?authSource=admin
      - AUTH_SECRET=your-super-secret-key-change-this-in-production
      - NEXTAUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - apms-network
    volumes:
      - ./public/assets:/app/public/assets

volumes:
  mongodb_data:
    driver: local

networks:
  apms-network:
    driver: bridge